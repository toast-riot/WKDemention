name: Auto Label Issue
on:
  issues:
    types: [opened]

jobs:
  apply-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Parse Dropdown Value
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            
            const match = body.match(/### Select the category that best fits this issue:\s*\n*(.+)/);
            
            if (match && match[1]) {
              const selectedTag = match[1].trim();
              
              const allowedTags = ["Bug", "Feature Request", "Question"];
              if (allowedTags.includes(selectedTag)) {
                core.setOutput("tag", selectedTag);
              }
            }

      - name: Add Label to Issue
        if: steps.parse.outputs.tag != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["${{ steps.parse.outputs.tag }}"]
            });
